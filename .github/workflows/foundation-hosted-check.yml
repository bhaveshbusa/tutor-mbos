name: Foundation hosted check

# Manual proof for the development deployment. It does not deploy, migrate,
# or schedule itself. Credentials stay in the development environment.
# Pull requests do not run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-hosted-check
  cancel-in-progress: false

jobs:
  check:
    name: Check tutor-mbos-dev foundation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development
    env:
      TUTOR_MBOS_ENV: development
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_ysIJHdIKYk2MQwvOKermUvIMuGVa
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The foundation check runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require the existing deployment token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set VERCEL_TOKEN at GitHub → Settings → Environments → development → Secrets. See docs/cloud-foundation.md."
            exit 1
          fi
      - name: Require the existing receiving key
        env:
          RESEND_DEVELOPMENT_RECEIVING_API_KEY: ${{ secrets.RESEND_DEVELOPMENT_RECEIVING_API_KEY }}
        run: |
          if [ -z "$RESEND_DEVELOPMENT_RECEIVING_API_KEY" ]; then
            echo "::error::RESEND_DEVELOPMENT_RECEIVING_API_KEY is absent from GitHub → Settings → Environments → development → Secrets. Do not create a new key. This job reads the existing synthetic-only receiving key."
            exit 1
          fi
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts development
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the foundation check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RESEND_DEVELOPMENT_RECEIVING_API_KEY: ${{ secrets.RESEND_DEVELOPMENT_RECEIVING_API_KEY }}
        run: node scripts/foundation-hosted-check.ts
