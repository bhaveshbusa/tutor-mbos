name: Migrate development

# Manual recovery only. A push to main runs the same migration inside
# Deploy development, before that deployment is promoted. This entry shares
# the development-delivery concurrency group so the two cannot overlap.
# Pull requests do not run it, and it cannot target production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-delivery
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to tutor-mbos-dev
    uses: ./.github/workflows/apply-development-migrations.yml
