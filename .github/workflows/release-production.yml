name: Release production

# Manual, gated promotion of a candidate that already passed the development
# deployment. Never triggered by a push. Secrets are only reachable from the
# protected 'production' GitHub environment (required reviewers, main only),
# and the environment variable PRODUCTION_RELEASES_ENABLED must be 'true'.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA already deployed to development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production releases are dispatched from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Candidate is on main and passed the development deployment
        id: verify
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
            echo "::error::Candidate is not on main."
            exit 1
          fi
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-development.yml/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=1" --jq '.total_count')"
          if [ "$passed" -lt 1 ]; then
            echo "::error::Candidate has no successful 'Deploy development' run."
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  checks:
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}

  release:
    name: Deploy to tutor-mbos
    needs: [candidate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_ENVIRONMENT: production
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_Ibov9zZm4KOvga3pWUQ83pInPJfQ
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require explicit release enablement
        env:
          PRODUCTION_RELEASES_ENABLED: ${{ vars.PRODUCTION_RELEASES_ENABLED }}
        run: |
          if [ "$PRODUCTION_RELEASES_ENABLED" != "true" ]; then
            echo "::error::Production releases are disabled. Set PRODUCTION_RELEASES_ENABLED=true on the 'production' environment only after final sign-off."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not set on the GitHub 'production' environment."
            exit 1
          fi
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts "$DEPLOY_ENVIRONMENT"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          export TUTOR_MBOS_BUILD_COMMIT="$(git rev-parse HEAD)"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
      - name: Scan deployment artifact for secrets
        run: pnpm hygiene --artifact .vercel/output
      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/smoke-health.ts \
            --base-url "${SMOKE_BASE_URL:-$DEPLOYMENT_URL}" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --commit "$(git rev-parse HEAD)"
