name: Apply development migrations

# Called by the development delivery sequence and by the manual recovery
# workflow. It is not triggered by pull requests and has no production target.
# Callers must pass the development environment secrets by name. A reusable
# workflow otherwise receives an empty string for an environment secret.
on:
  workflow_call:
    secrets:
      SUPABASE_MIGRATION_DATABASE_URL:
        required: true
      APP_RUNTIME_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to tutor-mbos-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development migrations run from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require migration credentials
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
        run: |
          status=0
          if [ -z "$SUPABASE_MIGRATION_DATABASE_URL" ]; then
            echo "::error::SUPABASE_MIGRATION_DATABASE_URL is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets)."
            status=1
          else
            echo "SUPABASE_MIGRATION_DATABASE_URL is present. Expected secret scope: GitHub environment development."
          fi
          if [ -z "$APP_RUNTIME_PASSWORD" ]; then
            echo "::error::APP_RUNTIME_PASSWORD is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets)."
            status=1
          else
            echo "APP_RUNTIME_PASSWORD is present. Expected secret scope: GitHub environment development."
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Development migrations stop before SQL until each absent secret above is present."
            exit 1
          fi
      # Prints each schema ledger version, name, and sha256, then app_runtime
      # flags and memberships. It does not print passwords or connection values.
      - name: Apply versioned migrations and privilege checks
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
        run: pnpm migrate:development
