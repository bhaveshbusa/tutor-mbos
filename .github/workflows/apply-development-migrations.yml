name: Apply development migrations

# Called by the development delivery sequence and by the manual recovery
# workflow. It is not triggered by pull requests and has no production target.
# The caller passes the development migration URL by name. A reusable workflow
# otherwise receives an empty string for an environment secret.
on:
  workflow_call:
    secrets:
      SUPABASE_MIGRATION_DATABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to tutor-mbos-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development migrations run from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require migration credentials
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_MIGRATION_DATABASE_URL" ]; then
            echo "::error::SUPABASE_MIGRATION_DATABASE_URL is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets)."
            echo "::error::Development migrations stop before SQL until that secret is present."
            exit 1
          fi
          echo "SUPABASE_MIGRATION_DATABASE_URL is present. Expected secret scope: GitHub environment development."
      - name: Reject a production or request-role URL before connecting
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: node scripts/migration-url.ts
      - name: Compare the recorded ledger with the reviewed files
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: node scripts/migration-url.ts --ledger
      - name: Apply pending migrations with the Supabase CLI
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: node scripts/migration-url.ts --push
