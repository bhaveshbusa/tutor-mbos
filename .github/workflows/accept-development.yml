name: Accept development

# Manual hosted acceptance for tutor-mbos-dev. It does not deploy, migrate,
# change Auth settings, or run on pull requests. Dispatch it from main after
# the development promotion for that commit. The workflow-level
# development-delivery group, with queue: max, covers preflight, business
# tests, and cleanup together. It waits behind an in-progress delivery and a
# later delivery waits behind the whole acceptance run. Neither cancels the
# other. Coding CI stays secretless.
#
# Privileged steps are separate jobs. Each job checks out this workflow SHA
# and installs from the lockfile with the shared pnpm cache disabled. The
# business job cannot change the cleanup job's checkout, install, or
# environment. The only data that crosses from the business job is the
# cleanup manifest artifact: labels and UUIDs, one-day retention. On a public
# repository that artifact is downloadable. It has no emails, keys, tokens,
# or database URLs. Cleanup downloads it under runner.temp, outside the
# checkout and the lockfile install, and opens only
# acceptance-cleanup-manifest.json from that directory. Extra artifact
# files are ignored and are not imported or executed. The pinned download
# action strips leading ../ and does not extract symlink entries. The run
# nonce and started_at are preflight job outputs.
# The business job cannot rewrite them through its own step environment.
# The nonce is not masked in preflight: Actions drops a masked job output.
# Accept and cleanup mask it when they read it. It is not a credential.
# The admin capability step runs before pnpm dlx vercel, so that unlocked
# package cannot change the environment of a step that holds the admin key
# or the Management API token. Same-run v4 artifact upload and download use
# the workflow contents permission.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-delivery
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Preflight tutor-mbos-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    outputs:
      nonce: ${{ steps.identity.outputs.nonce }}
      started_at: ${{ steps.identity.outputs.started_at }}
      cases: ${{ steps.identity.outputs.cases }}
    env:
      DEPLOY_ENVIRONMENT: development
      TUTOR_MBOS_ACCEPTANCE: development
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_ysIJHdIKYk2MQwvOKermUvIMuGVa
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Require Auth admin cleanup credential
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
        run: |
          if [ -z "$SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY" ]; then
            echo "::error::SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets). Purpose: development-only read-only admin capability check, then GET and DELETE of Auth users and OAuth clients created by this acceptance run. Supported shapes: sb_secret_ on the apikey header, or a legacy service_role JWT on apikey and Authorization Bearer. Not the Management API token and not a database credential. The business job does not receive it."
            exit 1
          fi
          echo "SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY is present. Expected secret scope: GitHub environment development."
      - name: Report acceptance credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DEVELOPMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEVELOPMENT_ACCESS_TOKEN }}
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets)."
            exit 1
          fi
          echo "VERCEL_TOKEN is present. Expected secret scope: GitHub environment development."
          if [ -z "$SUPABASE_DEVELOPMENT_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_DEVELOPMENT_ACCESS_TOKEN is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets). Purpose: read-only GET of development Auth config and PostgREST exposed schemas. Permissions: auth_config_read and data_api_config_read. Not a service-role key and not auth_config_write."
          else
            echo "SUPABASE_DEVELOPMENT_ACCESS_TOKEN is present. Expected secret scope: GitHub environment development."
          fi
          if [ -z "$TUTOR_MBOS_APP_DATABASE_URL" ]; then
            echo "::error::TUTOR_MBOS_APP_DATABASE_URL is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets). Purpose: development app_runtime connection for direct tenant reads and scoped business-row cleanup. Not the migration URL."
          else
            echo "TUTOR_MBOS_APP_DATABASE_URL is present. Expected secret scope: GitHub environment development."
          fi
      - name: Check admin capability and mint run identity
        id: identity
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
          SUPABASE_DEVELOPMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEVELOPMENT_ACCESS_TOKEN }}
        run: pnpm accept:development:preflight
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts "$DEPLOY_ENVIRONMENT"

  accept:
    name: Accept tutor-mbos-dev
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development
    env:
      TUTOR_MBOS_ACCEPTANCE: development
      ACCEPTANCE_RUN_NONCE: ${{ needs.preflight.outputs.nonce }}
      ACCEPTANCE_STARTED_AT: ${{ needs.preflight.outputs.started_at }}
      ACCEPTANCE_PREFLIGHT_CASES: ${{ needs.preflight.outputs.cases }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Run hosted acceptance
        timeout-minutes: 12
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm accept:development
      - name: Upload cleanup manifest
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-cleanup-manifest
          path: acceptance-cleanup-manifest.json
          retention-days: 1
          if-no-files-found: warn

  cleanup:
    name: Clean acceptance Auth resources
    needs: [preflight, accept]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    env:
      TUTOR_MBOS_ACCEPTANCE: development
      ACCEPTANCE_RUN_NONCE: ${{ needs.preflight.outputs.nonce }}
      ACCEPTANCE_STARTED_AT: ${{ needs.preflight.outputs.started_at }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Download cleanup manifest
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acceptance-cleanup-manifest
          path: ${{ runner.temp }}/acceptance-cleanup-data
      - name: Clean acceptance Auth resources
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
          ACCEPTANCE_MANIFEST_PATH: ${{ runner.temp }}/acceptance-cleanup-data/acceptance-cleanup-manifest.json
        run: pnpm accept:development:cleanup
