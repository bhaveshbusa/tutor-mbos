name: Accept development

# Manual hosted acceptance for tutor-mbos-dev. It does not deploy, migrate,
# change Auth settings, or run on pull requests. Dispatch it from main after
# the development promotion for that commit, or post the exact comment
# command on the merged pull request. The workflow-level concurrency group,
# with queue: max, covers an authorized run. workflow_dispatch and a new
# comment from actor 3823973 whose body starts with the command prefix use
# development-delivery, so that acceptance waits behind an in-progress
# delivery and a later delivery waits behind the acceptance run. An ordinary
# owner comment, a foreign comment, and a comment rerun use a per-run group
# and do not enter that queue. A recover-development comment from that actor
# on attempt 1 uses the same delivery queue. A later accept-development
# comment is allowed only when every earlier authorized comment run failed
# in the business job and cleanup proved both synthetic emails and the three
# client names are absent for that nonce. An empty manifest is not proof.
# Recover stays denied once that job has started.
# Neither cancels the other. A comment run is
# authorized only on attempt 1. workflow_dispatch is the manual path and is
# not rejected for a later attempt. Coding CI stays secretless.
#
# Privileged steps are separate jobs. Each job checks out this workflow SHA
# and installs from the lockfile with the shared pnpm cache disabled. The
# business job cannot change the cleanup job's checkout, install, or
# environment. The only data that crosses from the business job is the
# cleanup manifest job output: labels and UUIDs. It has no emails, keys,
# tokens, or database URLs. The accept step writes that JSON before it
# exits, including when the step fails. The value is not masked there,
# because Actions drops a masked job output. Cleanup binds it to an
# environment variable and does not place it in a shell command. There is
# no artifact upload or download. The run nonce and started_at are
# preflight job outputs.
# The business job cannot rewrite them through its own step environment.
# The nonce is not masked in preflight: Actions drops a masked job output.
# Accept and cleanup mask it when they read it. It is not a credential.
# The admin capability step runs before pnpm dlx vercel, so that unlocked
# package cannot change the environment of a step that holds the admin key
# or the Management API token. Protected jobs keep the workflow contents
# permission. The comment gate adds read access for pull requests and
# Actions run history, and it does not receive the development environment.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'development-delivery' || (github.event_name == 'issue_comment' && github.event.action == 'created' && github.actor_id == 3823973 && github.run_attempt == 1 && (startsWith(github.event.comment.body, '/tutor-mbos accept-development ') || startsWith(github.event.comment.body, '/tutor-mbos recover-development ')) && 'development-delivery' || format('acceptance-ignore-{0}', github.run_id)) }}
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    name: Authorize acceptance comment
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.repository == 'bhaveshbusa/tutor-mbos' && github.actor_id == 3823973 && github.run_attempt == 1 && (startsWith(github.event.comment.body, '/tutor-mbos accept-development ') || startsWith(github.event.comment.body, '/tutor-mbos recover-development '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Authorize acceptance comment
        id: gate
        env:
          ACCEPTANCE_EVENT_NAME: ${{ github.event_name }}
          ACCEPTANCE_EVENT_ACTION: ${{ github.event.action }}
          ACCEPTANCE_REPOSITORY: ${{ github.repository }}
          ACCEPTANCE_ACTOR_ID: ${{ github.actor_id }}
          ACCEPTANCE_ACTOR_LOGIN: ${{ github.actor }}
          ACCEPTANCE_COMMENT_BODY: ${{ github.event.comment.body }}
          ACCEPTANCE_COMMENT_ID: ${{ github.event.comment.id }}
          ACCEPTANCE_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACCEPTANCE_PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
          ACCEPTANCE_GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm accept:development:authorize

  preflight:
    name: Preflight tutor-mbos-dev
    needs: authorize
    if: "${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.run_attempt == 1 && needs.authorize.result == 'success')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    outputs:
      nonce: ${{ steps.identity.outputs.nonce }}
      started_at: ${{ steps.identity.outputs.started_at }}
      cases: ${{ steps.identity.outputs.cases }}
    env:
      DEPLOY_ENVIRONMENT: development
      TUTOR_MBOS_ACCEPTANCE: development
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_ysIJHdIKYk2MQwvOKermUvIMuGVa
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject comment rerun
        if: github.event_name == 'issue_comment'
        env:
          ACCEPTANCE_EVENT_NAME: ${{ github.event_name }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/assert-acceptance-attempt.mjs
      - name: Require authorized candidate
        if: github.event_name == 'issue_comment'
        env:
          ACCEPTANCE_CANDIDATE: ${{ needs.authorize.outputs.candidate }}
        run: node scripts/assert-acceptance-candidate.mjs
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Require Auth admin cleanup credential
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
        run: |
          if [ -z "$SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY" ]; then
            echo "::error::SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets). Purpose: development-only read-only admin capability check, then GET and DELETE of Auth users and OAuth clients created by this acceptance run. Supported shapes: sb_secret_ on the apikey header, or a legacy service_role JWT on apikey and Authorization Bearer. Not the Management API token and not a database credential. The business job does not receive it."
            exit 1
          fi
          echo "SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY is present. Expected secret scope: GitHub environment development."
      - name: Report acceptance credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DEVELOPMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEVELOPMENT_ACCESS_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets)."
            exit 1
          fi
          echo "VERCEL_TOKEN is present. Expected secret scope: GitHub environment development."
          if [ -z "$SUPABASE_DEVELOPMENT_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_DEVELOPMENT_ACCESS_TOKEN is absent. Expected secret scope: GitHub environment development (Settings → Environments → development → Secrets). Purpose: read-only GET of development Auth config and PostgREST exposed schemas. Permissions: auth_config_read and data_api_config_read. Not a service-role key and not auth_config_write."
          else
            echo "SUPABASE_DEVELOPMENT_ACCESS_TOKEN is present. Expected secret scope: GitHub environment development."
          fi
      - name: Require business acceptance secrets
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
        run: node scripts/assert-business-acceptance-secrets.mjs
      - name: Verify development protection and health
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm accept:development:health
      - name: Check admin capability and mint run identity
        id: identity
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
          SUPABASE_DEVELOPMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEVELOPMENT_ACCESS_TOKEN }}
        run: pnpm accept:development:preflight
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts "$DEPLOY_ENVIRONMENT"

  accept:
    name: Accept tutor-mbos-dev
    needs: preflight
    if: "${{ !cancelled() && needs.preflight.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.run_attempt == 1)) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development
    outputs:
      manifest: ${{ steps.acceptance.outputs.manifest }}
    env:
      TUTOR_MBOS_ACCEPTANCE: development
      ACCEPTANCE_RUN_NONCE: ${{ needs.preflight.outputs.nonce }}
      ACCEPTANCE_STARTED_AT: ${{ needs.preflight.outputs.started_at }}
      ACCEPTANCE_PREFLIGHT_CASES: ${{ needs.preflight.outputs.cases }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Reject comment rerun
        if: github.event_name == 'issue_comment'
        env:
          ACCEPTANCE_EVENT_NAME: ${{ github.event_name }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/assert-acceptance-attempt.mjs
      - name: Run hosted acceptance
        id: acceptance
        timeout-minutes: 12
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm accept:development

  cleanup:
    name: Clean acceptance Auth resources
    needs: [preflight, accept]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    env:
      TUTOR_MBOS_ACCEPTANCE: development
      ACCEPTANCE_RUN_NONCE: ${{ needs.preflight.outputs.nonce }}
      ACCEPTANCE_STARTED_AT: ${{ needs.preflight.outputs.started_at }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development acceptance runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Clean acceptance Auth resources
        id: cleanup
        env:
          SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY: ${{ secrets.SUPABASE_DEVELOPMENT_AUTH_ADMIN_KEY }}
          ACCEPTANCE_MANIFEST: ${{ needs.accept.outputs.manifest }}
        run: pnpm accept:development:cleanup
      - name: Record empty acceptance resources
        if: steps.cleanup.outputs.hosted_resources == 'none'
        run: echo hosted_resources=none
