name: Clean run 38954838195 app rows

# Manual development cleanup for one acceptance run. Read 39019907233
# showed both pinned businesses still present. This dispatch deletes only
# those businesses after the reviewed ids match. It does not sign up, read
# mail, call Auth admin, migrate, deploy, or run hosted acceptance.
# Preparing this workflow does not dispatch it. Dispatch waits on
# development-delivery. The only credential is the development app_runtime
# URL. Owner, client, and business ids are in the reviewed script.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-delivery
  cancel-in-progress: false
  queue: max

jobs:
  cleanup-app-rows:
    name: Clean run 38954838195 app rows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    env:
      TUTOR_MBOS_ACCEPTANCE: development
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Historical app-row cleanup runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: "false"
      - name: Require app runtime URL
        env:
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
        run: |
          if [ -z "$TUTOR_MBOS_APP_DATABASE_URL" ]; then
            echo "::error::TUTOR_MBOS_APP_DATABASE_URL is absent. Expected secret scope: GitHub environment development"
            exit 1
          fi
          echo "TUTOR_MBOS_APP_DATABASE_URL is present."
      - name: Clean run 38954838195 app rows
        env:
          TUTOR_MBOS_APP_DATABASE_URL: ${{ secrets.TUTOR_MBOS_APP_DATABASE_URL }}
        run: pnpm accept:development:cleanup-run-38954838195
