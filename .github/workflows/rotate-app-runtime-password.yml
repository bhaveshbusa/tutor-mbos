name: Rotate app runtime password

# Explicit development password rotation. Deploy development does not call
# this workflow. It does not migrate, deploy, or run acceptance. The
# confirmation is an environment value, not part of the shell command.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type rotate-app-runtime-password
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: development-delivery
  cancel-in-progress: false
  queue: max

jobs:
  rotate:
    name: Rotate app_runtime password
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::App runtime password rotation runs from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require rotation credentials
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_MIGRATION_DATABASE_URL" ] || [ -z "$APP_RUNTIME_PASSWORD" ]; then
            echo "::error::Rotation credentials are absent. Expected secret scope: GitHub environment development."
            exit 1
          fi
          echo "Rotation credentials are present."
      - name: Rotate app_runtime password
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
          APP_RUNTIME_PASSWORD_ROTATION: ${{ inputs.confirm }}
        run: pnpm rotate:app-runtime-password
