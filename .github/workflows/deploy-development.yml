name: Deploy development

# Every push to main runs CI, then a name-only Vercel preflight, then
# development migrations when reviewed migration inputs changed since the
# last successful development delivery, then a prebuilt deploy that is
# smoke tested before promotion. Manual dispatch always runs migrations.
# Credentials come from the protected development environment only. Pull
# requests do not run this workflow. queue: max keeps a pending delivery
# when a recovery run is dispatched.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-delivery
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  preflight:
    name: Verify tutor-mbos-dev configuration
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    env:
      DEPLOY_ENVIRONMENT: development
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_ysIJHdIKYk2MQwvOKermUvIMuGVa
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development deployments run from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set VERCEL_TOKEN at GitHub → Settings → Environments → development → Secrets. See docs/cloud-foundation.md. Development migrations and promotion do not run until this step passes."
            exit 1
          fi
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts "$DEPLOY_ENVIRONMENT"

  changes:
    name: Detect migration inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      migrate: ${{ steps.detect.outputs.migrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare migration inputs with the last successful delivery
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          write_migrate() {
            echo "migrate=$1" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            write_migrate true
            exit 0
          fi
          base="$(gh api --jq '.workflow_runs[0].head_sha // ""' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-development.yml/runs?branch=main&status=success&per_page=1" || true)"
          if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'; then
            write_migrate true
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" >/dev/null 2>&1; then
            write_migrate true
            exit 0
          fi
          if ! git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            write_migrate true
            exit 0
          fi
          set +e
          git diff --quiet "$base" "$GITHUB_SHA" -- \
            supabase/migrations \
            scripts/apply-migrations.ts \
            src/server/application/app-runtime-role.ts \
            .github/workflows/apply-development-migrations.yml
          diff_status=$?
          set -e
          if [ "$diff_status" -eq 0 ]; then
            write_migrate false
          else
            write_migrate true
          fi

  migrate:
    name: Migrate tutor-mbos-dev
    needs: [preflight, changes]
    if: needs.changes.outputs.migrate == 'true'
    uses: ./.github/workflows/apply-development-migrations.yml
    secrets:
      SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}

  deploy:
    name: Deploy to tutor-mbos-dev
    needs: [preflight, changes, migrate]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.preflight.result == 'success' && (needs.migrate.result == 'success' || (needs.migrate.result == 'skipped' && needs.changes.outputs.migrate == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_ENVIRONMENT: development
      VERCEL_ORG_ID: team_2QehRm248FPmHJTzKS0rvS6b
      VERCEL_PROJECT_ID: prj_ysIJHdIKYk2MQwvOKermUvIMuGVa
      VERCEL_CLI_VERSION: 63.1.2
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Development deployments run from main only."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Require deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set VERCEL_TOKEN at GitHub → Settings → Environments → development → Secrets. See docs/cloud-foundation.md. Promotion does not run until this step passes."
            exit 1
          fi
      - name: Pull Vercel project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
      - name: Verify deployment target binding
        run: node scripts/assert-deploy-target.ts "$DEPLOY_ENVIRONMENT"
      - name: Build
        run: |
          export TUTOR_MBOS_BUILD_COMMIT="$(git rev-parse HEAD)"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod
      - name: Scan deployment artifact for secrets
        run: pnpm hygiene --artifact .vercel/output
      # --skip-domain creates the deployment without moving traffic to it.
      - name: Deploy prebuilt output without promoting
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --skip-domain)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployment before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/smoke-health.ts \
            --base-url "$DEPLOYMENT_URL" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --commit "$(git rev-parse HEAD)"
      - name: Promote deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" promote "$DEPLOYMENT_URL" --yes --timeout=5m
      - name: Smoke test promoted alias
        if: vars.SMOKE_ALIAS_URL != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_ALIAS_URL: ${{ vars.SMOKE_ALIAS_URL }}
        run: |
          node scripts/smoke-health.ts \
            --base-url "$SMOKE_ALIAS_URL" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --commit "$(git rev-parse HEAD)"
