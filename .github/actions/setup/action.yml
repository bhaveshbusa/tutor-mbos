name: Set up toolchain
description: Install the pinned pnpm and Node.js versions and the locked dependencies.
inputs:
  pnpm-cache:
    description: Use the shared pnpm store. Acceptance jobs pass false so one job cannot poison another's install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: ${{ inputs.pnpm-cache == 'true' }}
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: ${{ inputs.pnpm-cache != 'true' }}
      with:
        node-version-file: .nvmrc
    - shell: bash
      run: pnpm install --frozen-lockfile
